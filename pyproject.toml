[build-system]
requires = [
  "setuptools>=61.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-pastebin"
description = "Submit pytest failure or test session information to a pastebin service"
version = "1.0.0"
readme = "README.rst"
requires-python = ">=3"
authors = [
    { name = "pytest development team" },
]
maintainers = [
    { name = "Ran Benita", email = "ran@unusedvar.com" },
]
license = "MIT"
license-files = [ "LICENSE" ]
classifiers = [
    "Framework :: Pytest",
    "Development Status :: 6 - Mature",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dependencies = [
    "pytest>=7",
]
[project.urls]
Repository = "https://github.com/pytest-dev/pytest-pastebin"
[project.entry-points.pytest11]
# The 2 is to avoid conflict with builtin `pastebin`.
pastebin2 = "pytest_pastebin.plugin"
